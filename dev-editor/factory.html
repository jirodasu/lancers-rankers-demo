<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RANKER FACTORY v1</title>
<style>:root{color-scheme:dark;font-family:system-ui;background:#070b12;color:#dbe5ef}body{margin:0}header{padding:14px 18px;background:#0b121e;border-bottom:1px solid #263448;display:flex;gap:12px;align-items:center}a{color:#e7c989}.wrap{display:grid;grid-template-columns:260px 1fr 340px;min-height:calc(100vh - 58px)}aside,main{padding:16px;border-right:1px solid #263448}.card{background:#0e1826;border:1px solid #304158;border-radius:7px;padding:12px;margin:8px 0}button,input,select{font:inherit;color:inherit;background:#142235;border:1px solid #40536b;border-radius:5px;padding:8px}button{cursor:pointer}.gold{background:#d6b574;color:#111a26}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.field{display:grid;gap:4px;font-size:12px}.field input,.field select{width:100%;box-sizing:border-box}.tech{display:grid;grid-template-columns:1.1fr 1.4fr .7fr .7fr .7fr;gap:5px;margin:5px 0}.ok{color:#8fd0ad}.warn{color:#e5bf77}pre{white-space:pre-wrap;font-size:11px}.draft{width:100%;text-align:left;margin:4px 0}@media(max-width:900px){.wrap{grid-template-columns:1fr}.tech{grid-template-columns:1fr 1fr}}</style></head>
<body><header><b>RANKER FACTORY v1</b><a href="./">← DEV EDITOR</a><span id="status" class="warn">設定読込中</span></header>
<div class="wrap"><aside><h3>RANKER</h3><div id="rankers"></div><h3>DRAFT</h3><div id="drafts"></div><button id="clone" class="gold">選択中を次のRANKへ複製</button><p style="font-size:11px;color:#8295aa">legacyは本編挙動を変更しません。draftはブラウザ内で編集・書き出しできます。</p></aside>
<main><div class="grid">
<label class="field">RANK<input id="rank" type="number" min="1" max="10"></label><label class="field">名前<input id="name"></label>
<label class="field">HP<input id="hp" type="number"></label><label class="field">Behavior<select id="behavior"><option>heavy-punish</option><option>orbit-chain</option><option>distance-control</option><option>feint</option><option>counter</option><option>adaptive</option></select></label>
<label class="field">近距離境界<input id="near" type="number"></label><label class="field">遠距離境界<input id="far" type="number"></label>
<label class="field">連撃 Phase1<input id="c1" type="number"></label><label class="field">連撃 Phase2<input id="c2" type="number"></label>
<label class="field">連撃 Phase3<input id="c3" type="number"></label><label class="field">CHANCE 秒<input id="chance" type="number" step=".01"></label>
<label class="field">S 秒<input id="s" type="number"></label><label class="field">A 秒<input id="a" type="number"></label><label class="field">B 秒<input id="b" type="number"></label></div>
<h3>技ブロック</h3><div id="techs"></div><button id="addTech">＋ 技を追加</button></main>
<aside><button id="validate" class="gold">設定を検証</button><button id="sim">5戦シミュレーション</button><button id="export">JSONを書き出し</button><div class="card"><b>検証結果</b><pre id="result">未実行</pre></div><div class="card"><b>5戦結果</b><pre id="simout">未実行</pre></div></aside></div>
<script>
let data,currentKey;const $=id=>document.getElementById(id), fields=['rank','name','hp','behavior','near','far','c1','c2','c3','chance','s','a','b'];
fetch('../config/ranker-factory.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{data=x;currentKey='9';renderList();load(data.rankers[currentKey]);$('status').textContent='設定読込済';$('status').className='ok'}).catch(e=>$('status').textContent='読込失敗 '+e);
function renderList(){ $('rankers').innerHTML='';for(const [k,r] of Object.entries(data.rankers).sort((a,b)=>b[0]-a[0])){let b=document.createElement('button');b.className='draft';b.textContent='RANK '+k+' '+r.displayName+' ['+r.runtime+']';b.onclick=()=>{save();currentKey=k;load(r)};$('rankers').append(b)};$('drafts').innerHTML='';for(const [k,r] of Object.entries(data.drafts||{}).sort((a,b)=>b[0]-a[0])){let b=document.createElement('button');b.className='draft';b.textContent='RANK '+k+' '+r.displayName+' [draft]';b.onclick=()=>{save();currentKey='d'+k;load(r)};$('drafts').append(b)}}
function load(r){$('rank').value=r.rank;$('name').value=r.displayName;$('hp').value=r.hp;$('behavior').value=r.behavior;$('near').value=r.distance.near;$('far').value=r.distance.far;[$('c1').value,$('c2').value,$('c3').value]=r.chain;$('chance').value=r.chance;$('s').value=r.clearRank.s;$('a').value=r.clearRank.a;$('b').value=r.clearRank.b;$('techs').innerHTML='';r.techniques.forEach(addTech)}
function addTech(t=['thrust','新技',.7,.25,20]){let d=document.createElement('div');d.className='tech';d.innerHTML='<select>'+Object.entries(data.actionBlocks).map(([k,v])=>'<option value="'+k+'">'+v.label+'</option>').join('')+'</select><input><input type="number" step=".01"><input type="number" step=".01"><input type="number">';[...d.children].forEach((x,i)=>x.value=t[i]);$('techs').append(d)}
function read(){return{rank:+$('rank').value,id:'rank'+$('rank').value,displayName:$('name').value,runtime:'draft',hp:+$('hp').value,behavior:$('behavior').value,distance:{near:+$('near').value,far:+$('far').value},chain:[+$('c1').value,+$('c2').value,+$('c3').value],chance:+$('chance').value,clearRank:{s:+$('s').value,a:+$('a').value,b:+$('b').value},techniques:[...$('techs').children].map(d=>[...d.children].map((x,i)=>i<2?x.value:+x.value))}}
function save(){if(!data||!currentKey)return;const r=read();if(currentKey.startsWith('d'))data.drafts[String(r.rank)]=r}
$('addTech').onclick=()=>addTech();$('clone').onclick=()=>{save();let r=read(),nr=Math.max(1,r.rank-1);r=structuredClone(r);r.rank=nr;r.id='rank'+nr;r.displayName='RANK '+nr+' DRAFT';r.runtime='draft';data.drafts[String(nr)]=r;currentKey='d'+nr;renderList();load(r)};
$('validate').onclick=()=>{let r=read(),e=[];if(!(r.rank>=1&&r.rank<=10))e.push('RANKは1〜10');if(r.hp<=0)e.push('HPは1以上');if(r.distance.near>=r.distance.far)e.push('距離境界: near < far');if(!(r.clearRank.s<r.clearRank.a&&r.clearRank.a<r.clearRank.b))e.push('時間は S < A < B');if(!r.techniques.length)e.push('技が必要');r.techniques.forEach((t,i)=>{if(t[2]<=0||t[3]<=0||t[4]<=0)e.push('技'+(i+1)+'の数値を確認')});$('result').textContent=e.length?'NG\n- '+e.join('\n- '):'OK\n設定上の矛盾なし'};
$('sim').onclick=()=>{let r=read(),out=[],base=r.techniques.reduce((n,t)=>n+t[2]+t[3],0)/r.techniques.length;for(let i=0;i<5;i++){let phaseChain=(r.chain[i%3]||1),cycle=base*phaseChain+r.chance+.34,time=(r.hp/Math.max(1,52-i*2))*cycle;out.push(time)}let avg=out.reduce((a,b)=>a+b,0)/5;$('simout').textContent=out.map((v,i)=>(i+1)+'戦目 '+v.toFixed(1)+'秒').join('\n')+'\n平均 '+avg.toFixed(1)+'秒\n※ルール比較用の簡易モデル。実機AIプレイではありません。'};
$('export').onclick=()=>{save();let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ranker-factory.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>

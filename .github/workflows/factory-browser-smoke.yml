name: Factory browser smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'dev-editor/**'
      - 'config/**'
      - 'index.html'
      - 'CLAUDE.md'
      - 'tests/factory_browser_smoke.mjs'
      - 'tests/main_game_real_browser_qa.mjs'
      - 'src/**'
      - '.github/workflows/factory-browser-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'dev-editor/**'
      - 'config/**'
      - 'index.html'
      - 'CLAUDE.md'
      - 'tests/factory_browser_smoke.mjs'
      - 'tests/main_game_real_browser_qa.mjs'
      - 'src/**'
      - '.github/workflows/factory-browser-smoke.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local preview
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/factory-http.log 2>&1 &
      - name: Exercise real-browser authoring flow
        run: node tests/factory_browser_smoke.mjs
      - name: QA main game (real Chromium + screenshots)
        if: always()
        run: node tests/main_game_real_browser_qa.mjs
      - name: Save QA screenshots and input traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-game-qa
          path: qa-artifacts/
          if-no-files-found: ignore

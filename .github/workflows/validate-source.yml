name: validate concatenated source

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'dev-editor/**'
      - 'index.html'
      - '.github/workflows/validate-source.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'dev-editor/**'
      - 'index.html'
      - '.github/workflows/validate-source.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Concatenate runtime in production order
        run: |
          cat \
            src/game01.txt \
            src/game02.txt \
            src/layout-fix.txt \
            src/practice-flow-fix.txt \
            src/balance-ui-fix.txt \
            src/rank-timer-fix.txt \
            src/game03.txt \
            src/game04.txt \
            src/game05.txt \
            src/game06.txt \
            src/game07.txt > /tmp/lancers_runtime.py
      - name: Validate Python syntax
        run: python -m py_compile /tmp/lancers_runtime.py
      - name: Run Rank 9 five-battle regression
        run: python tests/rank9_five_battle_regression.py
      - name: Validate Ranker Factory contract
        run: python tests/ranker_factory_contract.py
      - name: Validate beginner UX and JavaScript syntax
        run: python tests/beginner_ux_contract.py

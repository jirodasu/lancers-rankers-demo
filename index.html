<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080e19">
<meta name="robots" content="noindex">
<title>ランサーズ・ランカーズ｜RANK 10 → RANK 9</title>
<meta name="description" content="Pyxelで制作中。RANK 10ヘクトランを突破し、RANK 9旋槍のリゼルへ挑む槍アクション体験版。">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap');
html,body{margin:0;min-height:100%;background:#080e19;color:#e0e8ed;font:16px/1.7 'Noto Sans JP',sans-serif}
body{display:grid;place-items:center}
#boot-panel{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;box-sizing:border-box}
#boot-panel>div{max-width:34em}
h1{font-size:26px;line-height:1.4;color:#f0dcad;margin:10px 0 16px}
button{font:inherit;min-height:50px;padding:12px 24px;border:0;background:#dac18d;color:#152131;font-weight:800;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#boot-status{color:#b9c7d8}
#reload{margin-left:8px}
small{display:block;color:#8999ad;margin-top:14px}
#error{color:#ffb09e;white-space:pre-wrap;margin-top:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<section id="boot-panel">
  <div>
    <small>LANCERS / RANKERS — v5.2.2 — MADE WITH PYXEL</small>
    <h1>ランサーズ・ランカーズ<br>RANK 10 → RANK 9</h1>
    <p id="boot-status" role="status">ゲームを読み込んでいます…</p>
    <button id="boot" disabled>読み込み中…</button>
    <button id="reload" hidden>再読み込み</button>
    <div id="error"></div>
    <small>PC：WASD / 矢印で移動・Zで突き・Xで回避・Cで回復<br>スマホ：画面内のアナログスティックとボタンで操作</small>
  </div>
</section>
<script>
(() => {
  const VERSION='5.2.1';

  const sfxSources={
    normal:`./assets/sfx/hit_normal.mp3?v=${VERSION}`,
    charge:`./assets/sfx/hit_charge.mp3?v=${VERSION}`,
    break:`./assets/sfx/hit_break.mp3?v=${VERSION}`
  };
  const sfxPools={};
  const sfxCursors={normal:0,charge:0,break:0};
  const primedHitAudio=new WeakSet();
  for(const [name,src] of Object.entries(sfxSources)){
    sfxPools[name]=Array.from({length:4},()=>{
      const audio=new Audio(src);
      audio.preload='auto';
      audio.playsInline=true;
      audio.volume=0.1;
      audio.load();
      return audio;
    });
  }
  function primeLancerHitSfx(){
    for(const pool of Object.values(sfxPools)){
      for(const audio of pool){
        if(primedHitAudio.has(audio))continue;
        primedHitAudio.add(audio);
        const wasMuted=audio.muted;
        audio.muted=true;
        try{
          const result=audio.play();
          const settle=()=>{
            try{audio.pause();if(audio.readyState>=1)audio.currentTime=0;}catch{}
            audio.muted=wasMuted;
          };
          if(result?.then){
            result.then(settle).catch(()=>{
              audio.muted=wasMuted;
              primedHitAudio.delete(audio);
            });
          }else settle();
        }catch{
          audio.muted=wasMuted;
          primedHitAudio.delete(audio);
        }
      }
    }
  }
  window.lancerHitSfxSources=sfxSources;
  let canonicalTuning=null;
  const tuningConfigUrl=()=>`./config/lancers-tuning.json?v=${Date.now()}`;

  function applyCanonicalSound(sound={}){
    const volume=Math.max(0,Math.min(1,Number(sound.volume ?? .1)));
    const files=sound.files||{};
    for(const key of ['normal','charge','break']){
      const file=files[key];
      if(file && /^[a-zA-Z0-9._/-]+$/.test(file)){
        const path=file.includes('/')?file:`assets/sfx/${file}`;
        sfxSources[key]=`./${path}?v=${VERSION}`;
      }
      for(const audio of sfxPools[key]||[]){
        audio.volume=volume;
        if(audio.src!==new URL(sfxSources[key],location.href).href){
          audio.src=sfxSources[key];
          audio.load();
        }
      }
    }
  }

  function applyCanonicalUi(ui={}){
    const root=document.getElementById('lancer-shell')?.shadowRoot;
    if(!root)return false;
    for(const [id,v] of Object.entries(ui||{})){
      const el=root.getElementById(id);
      if(!el||!v)continue;
      if(Number.isFinite(Number(v.x))&&Number.isFinite(Number(v.y)))el.style.setProperty('translate',`${Number(v.x)}px ${Number(v.y)}px`,'important');
      if(Number.isFinite(Number(v.w)))el.style.setProperty('width',`${Number(v.w)}px`,'important');
      if(Number.isFinite(Number(v.h)))el.style.setProperty('height',`${Number(v.h)}px`,'important');
    }
    return true;
  }

  function scheduleCanonicalUi(ui){
    if(!ui||!Object.keys(ui).length)return;
    let tries=0;
    const timer=setInterval(()=>{
      if(applyCanonicalUi(ui)||++tries>120)clearInterval(timer);
    },250);
  }

  async function loadCanonicalTuning(){
    const response=await fetch(tuningConfigUrl(),{cache:'no-store'});
    if(!response.ok)throw new Error(`正規設定を取得できませんでした: ${response.status}`);
    const data=await response.json();
    if(data?.schema!=='lancers-tuning/v1')throw new Error('正規設定のschemaが不正です');
    canonicalTuning=data;
    window.lancerCanonicalTuning=data;
    window.getLancerDevTuning=()=>JSON.stringify(data.monster||{});
    applyCanonicalSound(data.sound);
    scheduleCanonicalUi(data.ui);
    return data;
  }

  window.playLancerHitSfx=kind=>{
    if(window.lancerInput?.muted)return;
    const key=Object.prototype.hasOwnProperty.call(sfxPools,kind)?kind:'normal';
    const pool=sfxPools[key];
    const audio=pool[sfxCursors[key]++%pool.length];
    let retried=false;
    const playNow=()=>{
      try{
        audio.pause();
        if(audio.readyState>=1)audio.currentTime=0;
        const result=audio.play();
        if(result?.catch)result.catch(()=>{
          if(retried)return;
          retried=true;
          const retry=()=>{
            try{
              if(audio.readyState>=1)audio.currentTime=0;
              const again=audio.play();
              if(again?.catch)again.catch(()=>{});
            }catch{}
          };
          if(audio.readyState<3){
            audio.addEventListener('canplay',retry,{once:true});
            audio.load();
          }
        });
      }catch{
        if(retried)return;
        retried=true;
        try{
          audio.addEventListener('canplay',()=>{
            try{audio.currentTime=0;audio.play().catch?.(()=>{});}catch{}
          },{once:true});
          audio.load();
        }catch{}
      }
    };
    playNow();
  };

  const SOURCE_PARTS=[
    './src/game01.txt',
    './src/game02.txt',
    './src/layout-fix.txt',
    './src/practice-flow-fix.txt',
    './src/balance-ui-fix.txt',
    './src/rank-timer-fix.txt',
    './src/game03.txt',
    './src/game04.txt',
    './src/game05.txt',
    './src/game06.txt',
    './src/game07.txt'
  ].map(path=>`${path}?v=${VERSION}`);

  const status=document.getElementById('boot-status');
  const button=document.getElementById('boot');
  const reload=document.getElementById('reload');
  const errorBox=document.getElementById('error');
  let failed=false,started=false,watch=null,timeout=null;

  function fail(message){
    if(failed)return;
    failed=true;
    clearInterval(watch);clearTimeout(timeout);
    status.textContent='起動に失敗しました。';
    errorBox.textContent=message;
    button.hidden=true;
    reload.hidden=false;
  }
  reload.onclick=()=>location.reload();
  button.onclick=()=>{
    primeLancerHitSfx();
    if(window.pyxelContext?.resolveInput){
      window.pyxelContext.resolveInput();
      button.disabled=true;
      button.textContent='起動中…';
      status.textContent='闘技場を準備しています…';
    }
  };

  window.startLancerRuntime=async()=>{
    if(started)return;
    started=true;
    try{
      status.textContent='正規設定と最新ゲームデータを読み込んでいます…';
      try{
        await loadCanonicalTuning();
      }catch(configError){
        console.warn('[Lancers] canonical tuning fallback:',configError);
      }
      const responses=await Promise.all(SOURCE_PARTS.map(path=>fetch(path,{cache:'no-store'})));
      for(const response of responses){
        if(!response.ok)throw new Error(`ゲームデータを取得できませんでした: ${response.status}`);
      }
      let source=(await Promise.all(responses.map(r=>r.text()))).join('\n');

      // v4.6a37: 双短槍・紅牙の溜めを、実時間差のある3連突きへ試験変更。
      const patchRequired=(before,after,label)=>{
        if(!source.includes(before))throw new Error(`紅牙${label}の調整元データが見つかりません。ページを再読み込みしてください。`);
        source=source.replace(before,after);
      };

      patchRequired(
        "dict(name='双短槍・紅牙', damage=11, charged=19, cost=10, ccost=22, charge=.5, duration=.14, recovery=.28, reach=20, width=6, poise=2, cpoise=6, color=14)",
        "dict(name='双短槍・紅牙', damage=15, charged=30, cost=8, ccost=30, charge=.5, duration=.14, recovery=.28, reach=20, width=6, poise=2, cpoise=9, color=14)",
        '基本値'
      );
      patchRequired(
        "damage_table = ((20,40,52), (38,70,84), (11,19,25))",
        "damage_table = ((20,40,52), (38,70,84), (15,30,30))",
        'ダメージ表'
      );
      source=source.replaceAll('威力11 / 溜め19','威力15 / 連突10×3');

      patchRequired(
`        self.hit_vfx = []
        self.charging = False`,
`        self.hit_vfx = []
        self.benikiba_burst = []
        self.charging = False`,
        '連突初期化'
      );

      patchRequired(
`        self.elapsed += DT
        for name in ('invuln', 'dodge', 'lock', 'regen_delay', 'attack_anim', 'flash'):`,
`        self.elapsed += DT
        self.update_benikiba_burst(DT)
        for name in ('invuln', 'dodge', 'lock', 'regen_delay', 'attack_anim', 'flash'):`,
        '連突更新'
      );

      patchRequired(
`        if segment_hit(self.bx, self.by, self.px, self.py, self.px+ux*w['reach'], self.py+uy*w['reach'], 9+w['width']/2):
            # v4.6a31: explicit per-weapon hit values.`,
`        if segment_hit(self.bx, self.by, self.px, self.py, self.px+ux*w['reach'], self.py+uy*w['reach'], 9+w['width']/2):
            # v4.6a37: 双短槍・紅牙の溜めは0.08秒間隔の3連突き。
            if full and self.weapon_index == 2:
                if self.mode == 'training' and self.tutorial_step == 2:
                    self.tutorial_step = 3
                    self.tutorial_done = True
                    self.stop_bgm()
                    self.mode = 'training_complete'
                    self.notice = '✓ 三連突き成功'
                    return
                punish = self.state == 'break' or (self.state == 'recover' and (self.rank != 9 or self.rank9_opening))
                if punish:
                    self.text(self.bx-10, self.by-22, 'PUNISH', 10)
                per_hit = 10
                self.benikiba_burst = [
                    [0.0, per_hit, 3, 0],
                    [.08, per_hit, 3, 1],
                    [.16, per_hit, 3, 2],
                ]
                self.update_benikiba_burst(0.0)
                return
            # v4.6a31: explicit per-weapon hit values.`,
        '連突発動'
      );

      patchRequired(
`    def hurt(self, damage):`,
`    def update_benikiba_burst(self, dt):
        if not self.benikiba_burst:
            return
        pending = self.benikiba_burst
        self.benikiba_burst = []
        for hit in pending:
            hit[0] -= dt
            if hit[0] <= 1e-8:
                self.apply_benikiba_burst_hit(hit[1], hit[2], hit[3])
                if self.bhp <= 0:
                    self.benikiba_burst = []
                    return
            else:
                self.benikiba_burst.append(hit)

    def apply_benikiba_burst_hit(self, damage, poise_damage, burst_index):
        if self.bhp <= 0 or self.mode not in ('battle', 'training'):
            return
        was_break = self.state == 'break'
        if not was_break:
            self.poise += poise_damage
            if self.poise >= 100:
                self.poise = 0
                self.state, self.timer = 'break', 3.0
                self.notice = 'BREAK! 溜め突きで追撃'
                self.text(self.bx-10, self.by-16, 'BREAK!', 10)

        self.bhp = max(0, self.bhp-damage)
        if window is not None and not self.muted:
            try:
                window.playLancerHitSfx('charge' if burst_index == 2 else 'normal')
            except Exception:
                pass

        dev = dev_monster_tuning('lizel' if self.rank == 9 else 'hectoran')
        benikiba_dev = dev.get('benikiba', {}) if isinstance(dev.get('benikiba', {}), dict) else {}
        hs = benikiba_dev.get('hitstop', {}) if isinstance(benikiba_dev.get('hitstop', {}), dict) else {}
        rc = benikiba_dev.get('recoil', {}) if isinstance(benikiba_dev.get('recoil', {}), dict) else {}
        hit_key = 'break' if was_break and burst_index == 2 else ('charge' if burst_index == 2 else 'normal')
        burst_hitstop = int(hs.get(hit_key, 3 if burst_index == 2 else 1))
        self.hitstop_frames = max(self.hitstop_frames, max(0, burst_hitstop))
        ux, uy = math.cos(self.aa), math.sin(self.aa)
        # v4.6a40: 紅牙も描画だけ命中方向へ反応。3発目だけ一段強くする。
        self.hit_reaction_dx = ux
        self.hit_reaction_dy = uy
        self.hit_reaction_tier = 2 if burst_index == 2 else 1
        recoil_default = 3 if burst_index == 2 else 2
        self.hit_reaction_px = float(rc.get(hit_key, recoil_default))
        self.dev_fx_scale = max(.25, float(dev.get('fxScale', 1.0)))
        self.dev_fx_life = max(.05, float(dev.get('fxLife', .36)))
        self.dev_fx_type = str(dev.get('fxType', 'spear'))
        self.dev_shake_px = max(0, int(dev.get('shakePx', 1)))
        if was_break and burst_index == 2:
            self.break_shake_until = self.frame + max(0, int(benikiba_dev.get('shakeFrames', 6)))
        vx, vy = -uy, ux
        offset = (-3, 3, 0)[burst_index]
        contact_x = self.bx - ux*8 + vx*offset
        contact_y = self.by - uy*8 + vy*offset
        self.hit_vfx.append([contact_x, contact_y, self.aa, 2 if burst_index == 2 else 1, self.dev_fx_life])
        self.flash = max(.01, float(benikiba_dev.get('flash', .08)))

        # v4.6a37: spread the three damage numbers across the screen and show a clear total.
        # Using screen-space offsets keeps them readable regardless of spear direction.
        damage_x = self.bx + (-12, 0, 12)[burst_index]
        damage_y = self.by - 14 - burst_index*2
        damage_col = 10 if burst_index == 2 else 7
        self.fx.append([damage_x, damage_y, str(damage), damage_col, .72])
        if burst_index == 2:
            self.fx.append([self.bx-13, self.by-29, 'TOTAL '+str(damage*3), 10, 1.05])

        self.phase = 3 if self.bhp <= self.boss_max*.30 else 2 if self.bhp <= self.boss_max*.60 else 1

        if self.bhp == 0 and self.mode == 'battle':
            self.stop_bgm()
            self.victory_pending = True
            self.victory_timer = 2.65
            self.hitstop_frames = 21
            self.lock = max(self.lock, 3.2)
            self.invuln = max(self.invuln, 3.2)
            self.charging, self.pending = False, None
            self.state = 'recover'
            self.flash = .12
            self.notice = 'RANK '+str(self.rank)+' 撃破'
            kx, ky = unit(self.bx-self.px, self.by-self.py)
            start_x, start_y = self.bx, self.by
            target_x, target_y = start_x+kx*22, start_y+ky*22
            target_dist = math.hypot(target_x-CX, target_y-CY)
            if target_dist > R-10:
                tx, ty = unit(target_x-CX, target_y-CY)
                target_x, target_y = CX+tx*(R-10), CY+ty*(R-10)
            self.victory_start = (start_x, start_y)
            self.victory_target = (target_x, target_y)

    def hurt(self, damage):`,
        '連突処理'
      );

      // v4.6a38: user-authored Pyxel MML Studio theme for the weapon-select screen.
      const SELECT_BGM_CH1=`T108 @1 V58 Q72 O4 L8
D R F A G F E D
D R F A >C <A G F
E R G B- A G F E
D R A R G F E R
D F A >D <C A G F
E G B- >C <B- A G E
F A >C D <A G F E
D R A R D4 R4`;
      const SELECT_BGM_CH2=`T108 @2 V34 Q48 Y-6 O4 L8
[D F A F D F A F
C E G E C E G E
B- D F D B- D F D
A C# E C# A C# E C#]2`;
      const SELECT_BGM_CH3=`T108 @0 V52 Q82 O2 L4
[D D A A
C C G G
B- B- F F
A A E E]2`;
      const SELECT_BGM_CH4=`T108 @3 V30 Q38 O2 L16
[C R R R G R R R C R R R G R R R]8`;

      const unitMarker='\ndef unit(x, y):';
      if(!source.includes(unitMarker))throw new Error('武器選択BGMの挿入位置が見つかりません。ページを再読み込みしてください。');
      source=source.replace(unitMarker,
`\n# CHOOSE YOUR SPEAR — weapon select theme, authored in Pyxel MML Studio.
SELECT_BGM_CH1 = """${SELECT_BGM_CH1}"""
SELECT_BGM_CH2 = """${SELECT_BGM_CH2}"""
SELECT_BGM_CH3 = """${SELECT_BGM_CH3}"""
SELECT_BGM_CH4 = """${SELECT_BGM_CH4}"""
\ndef unit(x, y):`);

      const oldBgmSetup=`            pyxel.sounds[10].mml(BGM_CH1)
            pyxel.sounds[11].mml(BGM_CH2)
            pyxel.sounds[12].mml(BGM_CH3)
            pyxel.sounds[13].mml(BGM_CH4)
            if self.extended_audio:
                pyxel.musics[0].set([10], [11], [12], [13])
            else:
                pyxel.musics[0].set([10], [11], [12])
            self.ready_bgm = True`;
      const newBgmSetup=`            pyxel.sounds[10].mml(BGM_CH1)
            pyxel.sounds[11].mml(BGM_CH2)
            pyxel.sounds[12].mml(BGM_CH3)
            pyxel.sounds[13].mml(BGM_CH4)
            pyxel.sounds[14].mml(SELECT_BGM_CH1)
            pyxel.sounds[15].mml(SELECT_BGM_CH2)
            pyxel.sounds[16].mml(SELECT_BGM_CH3)
            pyxel.sounds[17].mml(SELECT_BGM_CH4)
            if self.extended_audio:
                pyxel.musics[0].set([10], [11], [12], [13])
                pyxel.musics[1].set([14], [15], [16], [17])
            else:
                pyxel.musics[0].set([10], [11], [12])
                pyxel.musics[1].set([14], [15], [16])
            self.ready_bgm = True`;
      if(!source.includes(oldBgmSetup))throw new Error('BGM初期化部分が見つかりません。ページを再読み込みしてください。');
      source=source.replace(oldBgmSetup,newBgmSetup);

      const oldBgmMethods=`    def start_bgm(self):
        if self.ready_bgm and not self.muted and self.mode == 'battle' and not self.bgm_playing:
            pyxel.playm(0, loop=True)
            self.bgm_playing = True

    def stop_bgm(self):`;
      const newBgmMethods=`    def start_bgm(self):
        if self.ready_bgm and not self.muted and self.mode == 'battle' and not self.bgm_playing:
            pyxel.playm(0, loop=True)
            self.bgm_playing = True

    def start_select_bgm(self):
        if self.ready_bgm and not self.muted and self.mode == 'select' and not self.bgm_playing:
            pyxel.playm(1, loop=True)
            self.bgm_playing = True

    def stop_bgm(self):`;
      if(!source.includes(oldBgmMethods))throw new Error('BGM再生処理が見つかりません。ページを再読み込みしてください。');
      source=source.replace(oldBgmMethods,newBgmMethods);

      const oldInitialPublish=`        self.reset()
        self.publish()
        if auto_run:`;
      const newInitialPublish=`        self.reset()
        self.publish()
        self.start_select_bgm()
        if auto_run:`;
      if(!source.includes(oldInitialPublish))throw new Error('初期画面BGMの開始位置が見つかりません。ページを再読み込みしてください。');
      source=source.replace(oldInitialPublish,newInitialPublish);

      const oldMuteResume=`            elif self.mode == 'battle':
                self.start_bgm()`;
      const newMuteResume=`            elif self.mode == 'battle':
                self.start_bgm()
            elif self.mode == 'select':
                self.start_select_bgm()`;
      if(!source.includes(oldMuteResume))throw new Error('ミュート解除処理が見つかりません。ページを再読み込みしてください。');
      source=source.replace(oldMuteResume,newMuteResume);

      const oldSelectCommand=`        if command == 'select':
            self.stop_bgm()
            self.mode = 'select'
        if command == 'rank9_select':
            self.stop_bgm()
            self.rank = 9
            self.reset()
            self.tutorial_done = True
            self.mode = 'select'
            self.notice = 'RANK 9 — 武器を選べ'
        if self.mode == 'select':
            self.weapon_index = max(0, min(2, c.get('weapon', self.weapon_index)))`;
      const newSelectCommand=`        if command == 'select':
            self.stop_bgm()
            self.mode = 'select'
            self.start_select_bgm()
        if command == 'rank9_select':
            self.stop_bgm()
            self.rank = 9
            self.reset()
            self.tutorial_done = True
            self.mode = 'select'
            self.notice = 'RANK 9 — 武器を選べ'
        if self.mode == 'select':
            self.weapon_index = max(0, min(2, c.get('weapon', self.weapon_index)))
            self.start_select_bgm()`;
      if(!source.includes(oldSelectCommand))throw new Error('武器選択画面の遷移処理が見つかりません。ページを再読み込みしてください。');
      source=source.replace(oldSelectCommand,newSelectCommand);

      if(!source.includes('BROWSER_UI = r')||!source.includes('class App:')||!source.includes('練習モード')||!source.includes('本番をはじめる')||!source.includes('BGM_CH1')||!source.includes('LAYOUT_STABILITY_FIX')||!source.includes('PRACTICE_FLOW_FIX')||!source.includes('BALANCE_UI_FIX')||!source.includes('RANK_TIMER_FIX')){
        throw new Error('ゲームデータが不完全です。ページを再読み込みしてください。');
      }
      status.textContent='Pyxelを起動しています…';
      Promise.resolve(launchPyxel({command:'run',script:source})).catch(error=>fail(String(error?.message||error)));
      watch=setInterval(()=>{
        const host=document.getElementById('lancer-shell');
        if(host){
          document.getElementById('boot-panel').hidden=true;
          clearInterval(watch);clearTimeout(timeout);
          return;
        }
        if(window.pyxelContext?.hasFatalError){
          fail('Pyxel実行環境でエラーが発生しました。再読み込みしてください。');
          return;
        }
        if(window.pyxelContext?.resolveInput){
          button.disabled=false;
          button.textContent='ゲームを起動';
          status.textContent='準備ができました。「ゲームを起動」を押してください。';
        }
      },200);
      timeout=setTimeout(()=>{
        if(!document.getElementById('lancer-shell'))fail('読み込みに時間がかかっています。接続を確認して再読み込みしてください。');
      },90000);
    }catch(error){
      fail(String(error?.message||error));
    }
  };
  window.lancerRuntimeDownloadFailed=()=>fail('Pyxelの読み込みに失敗しました。インターネット接続を確認してください。');
})();
</script>
<script src="https://cdn.jsdelivr.net/gh/kitao/pyxel@v2.9.9/wasm/pyxel.js" onload="startLancerRuntime()" onerror="lancerRuntimeDownloadFailed()"></script>
</body>

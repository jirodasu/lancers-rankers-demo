<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080e19">
<title>ランサーズ・ランカーズ｜ランク10位戦 体験版</title>
<style>
html,body{margin:0;min-height:100%;background:#080e19;color:#e0e8ed;font:16px/1.7 system-ui,sans-serif}
body{display:grid;place-items:center}
main{padding:32px;text-align:center;max-width:34em}
h1{color:#f0dcad;font-size:24px}
#error{color:#ffb09e;white-space:pre-wrap;margin-top:16px}
</style>
</head>
<body>
<main>
<h1>ランサーズ・ランカーズ</h1>
<p id="status">PC確認版を読み込んでいます…</p>
<div id="error"></div>
</main>
<script>
(async()=>{
  const status=document.getElementById('status');
  const errorBox=document.getElementById('error');
  const parts=[
    './parts/part01.txt',
    './parts/part02.txt',
    './parts/part03.txt',
    './parts/part04.txt',
    './parts/part05.txt',
    './parts/part06.txt'
  ];
  try{
    const responses=await Promise.all(parts.map(path=>fetch(path+'?v=4',{cache:'no-store'})));
    for(const response of responses){
      if(!response.ok)throw new Error('ゲームデータを取得できませんでした: '+response.status);
    }
    const texts=await Promise.all(responses.map(response=>response.text()));

    // part03 starts in the middle of a JavaScript string. During the first
    // GitHub split, literal "\\n" sequences in that string became physical
    // line breaks. Restore only that string section before concatenating.
    const cssEnd='body>pyxel-run{display:none}#editor-toggle{white-space:nowrap}";';
    const cssEndAt=texts[2].indexOf(cssEnd);
    if(cssEndAt<0)throw new Error('ゲームデータの復元位置を確認できませんでした');
    const beforeEnd=cssEndAt+cssEnd.length;
    texts[2]=texts[2].slice(0,beforeEnd).replace(/\n/g,'\\n')+texts[2].slice(beforeEnd);

    const html=texts.join('');
    if(!html.startsWith('<!doctype html>')||!html.includes('startLancerRuntime')||!html.includes('pyxel@v2.9.9')){
      throw new Error('ゲームデータが不完全です');
    }
    status.textContent='ゲームを起動しています…';
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    status.textContent='起動に失敗しました。';
    errorBox.textContent=String(error);
  }
})();
</script>
</body>
</html>

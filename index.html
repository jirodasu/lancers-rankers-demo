<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080e19">
<meta name="robots" content="noindex">
<title>ランサーズ・ランカーズ｜ランク10位戦 体験版</title>
<meta name="description" content="Pyxelで制作中。城門の守槍ヘクトランに挑む、槍アクション体験版。">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap');
html,body{margin:0;min-height:100%;background:#080e19;color:#e0e8ed;font:16px/1.7 'Noto Sans JP',sans-serif}
body{display:grid;place-items:center}
#boot-panel{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;box-sizing:border-box}
#boot-panel>div{max-width:34em}
h1{font-size:26px;line-height:1.4;color:#f0dcad;margin:10px 0 16px}
button{font:inherit;min-height:50px;padding:12px 24px;border:0;background:#dac18d;color:#152131;font-weight:800;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#boot-status{color:#b9c7d8}
#reload{margin-left:8px}
small{display:block;color:#8999ad;margin-top:14px}
#error{color:#ffb09e;white-space:pre-wrap;margin-top:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<section id="boot-panel">
  <div>
    <small>LANCERS / RANKERS — v4.6a36 — MADE WITH PYXEL</small>
    <h1>ランサーズ・ランカーズ<br>RANK 10 体験版</h1>
    <p id="boot-status" role="status">ゲームを読み込んでいます…</p>
    <button id="boot" disabled>読み込み中…</button>
    <button id="reload" hidden>再読み込み</button>
    <div id="error"></div>
    <small>PC：WASD / 矢印で移動・Zで突き・Xで回避・Cで回復<br>スマホ：画面内のアナログスティックとボタンで操作</small>
  </div>
</section>
<script>
(() => {
  const VERSION='4.6a36';

  const sfxSources={
    normal:`./assets/sfx/hit_normal.mp3?v=${VERSION}`,
    charge:`./assets/sfx/hit_charge.mp3?v=${VERSION}`,
    break:`./assets/sfx/hit_break.mp3?v=${VERSION}`
  };
  const sfxPools={};
  const sfxCursors={normal:0,charge:0,break:0};
  const primedHitAudio=new WeakSet();
  for(const [name,src] of Object.entries(sfxSources)){
    sfxPools[name]=Array.from({length:4},()=>{
      const audio=new Audio(src);
      audio.preload='auto';
      audio.playsInline=true;
      audio.volume=0.1;
      audio.load();
      return audio;
    });
  }
  function primeLancerHitSfx(){
    for(const pool of Object.values(sfxPools)){
      for(const audio of pool){
        if(primedHitAudio.has(audio))continue;
        primedHitAudio.add(audio);
        const wasMuted=audio.muted;
        audio.muted=true;
        try{
          const result=audio.play();
          const settle=()=>{
            try{audio.pause();if(audio.readyState>=1)audio.currentTime=0;}catch{}
            audio.muted=wasMuted;
          };
          if(result?.then){
            result.then(settle).catch(()=>{
              audio.muted=wasMuted;
              primedHitAudio.delete(audio);
            });
          }else settle();
        }catch{
          audio.muted=wasMuted;
          primedHitAudio.delete(audio);
        }
      }
    }
  }
  window.lancerHitSfxSources=sfxSources;
  window.playLancerHitSfx=kind=>{
    if(window.lancerInput?.muted)return;
    const key=Object.prototype.hasOwnProperty.call(sfxPools,kind)?kind:'normal';
    const pool=sfxPools[key];
    const audio=pool[sfxCursors[key]++%pool.length];
    let retried=false;
    const playNow=()=>{
      try{
        audio.pause();
        if(audio.readyState>=1)audio.currentTime=0;
        const result=audio.play();
        if(result?.catch)result.catch(()=>{
          if(retried)return;
          retried=true;
          const retry=()=>{
            try{
              if(audio.readyState>=1)audio.currentTime=0;
              const again=audio.play();
              if(again?.catch)again.catch(()=>{});
            }catch{}
          };
          if(audio.readyState<3){
            audio.addEventListener('canplay',retry,{once:true});
            audio.load();
          }
        });
      }catch{
        if(retried)return;
        retried=true;
        try{
          audio.addEventListener('canplay',()=>{
            try{audio.currentTime=0;audio.play().catch?.(()=>{});}catch{}
          },{once:true});
          audio.load();
        }catch{}
      }
    };
    playNow();
  };

  const SOURCE_PARTS=[
    './src/game01.txt',
    './src/game02.txt',
    './src/layout-fix.txt',
    './src/practice-flow-fix.txt',
    './src/balance-ui-fix.txt',
    './src/rank-timer-fix.txt',
    './src/game03.txt',
    './src/game04.txt',
    './src/game05.txt',
    './src/game06.txt',
    './src/game07.txt'
  ].map(path=>`${path}?v=${VERSION}`);

  const status=document.getElementById('boot-status');
  const button=document.getElementById('boot');
  const reload=document.getElementById('reload');
  const errorBox=document.getElementById('error');
  let failed=false,started=false,watch=null,timeout=null;

  function fail(message){
    if(failed)return;
    failed=true;
    clearInterval(watch);clearTimeout(timeout);
    status.textContent='起動に失敗しました。';
    errorBox.textContent=message;
    button.hidden=true;
    reload.hidden=false;
  }
  reload.onclick=()=>location.reload();
  button.onclick=()=>{
    primeLancerHitSfx();
    if(window.pyxelContext?.resolveInput){
      window.pyxelContext.resolveInput();
      button.disabled=true;
      button.textContent='起動中…';
      status.textContent='闘技場を準備しています…';
    }
  };

  window.startLancerRuntime=async()=>{
    if(started)return;
    started=true;
    try{
      status.textContent='最新のゲームデータを読み込んでいます…';
      const responses=await Promise.all(SOURCE_PARTS.map(path=>fetch(path,{cache:'no-store'})));
      for(const response of responses){
        if(!response.ok)throw new Error(`ゲームデータを取得できませんでした: ${response.status}`);
      }
      let source=(await Promise.all(responses.map(r=>r.text()))).join('\n');

      // v4.6a36: 双短槍・紅牙の溜めを、実時間差のある3連突きへ試験変更。
      const patchRequired=(before,after,label)=>{
        if(!source.includes(before))throw new Error(`紅牙${label}の調整元データが見つかりません。ページを再読み込みしてください。`);
        source=source.replace(before,after);
      };

      patchRequired(
        "dict(name='双短槍・紅牙', damage=11, charged=19, cost=10, ccost=22, charge=.5, duration=.14, recovery=.28, reach=20, width=6, poise=2, cpoise=6, color=14)",
        "dict(name='双短槍・紅牙', damage=15, charged=24, cost=8, ccost=30, charge=.5, duration=.14, recovery=.28, reach=20, width=6, poise=2, cpoise=9, color=14)",
        '基本値'
      );
      patchRequired(
        "damage_table = ((20,40,52), (38,70,84), (11,19,25))",
        "damage_table = ((20,40,52), (38,70,84), (15,24,30))",
        'ダメージ表'
      );
      source=source.replaceAll('威力11 / 溜め19','威力15 / 連突8×3');

      patchRequired(
`        self.hit_vfx = []
        self.charging = False`,
`        self.hit_vfx = []
        self.benikiba_burst = []
        self.charging = False`,
        '連突初期化'
      );

      patchRequired(
`        self.elapsed += DT
        for name in ('invuln', 'dodge', 'lock', 'regen_delay', 'attack_anim', 'flash'):`,
`        self.elapsed += DT
        self.update_benikiba_burst(DT)
        for name in ('invuln', 'dodge', 'lock', 'regen_delay', 'attack_anim', 'flash'):`,
        '連突更新'
      );

      patchRequired(
`        if segment_hit(self.bx, self.by, self.px, self.py, self.px+ux*w['reach'], self.py+uy*w['reach'], 9+w['width']/2):
            # v4.6a31: explicit per-weapon hit values.`,
`        if segment_hit(self.bx, self.by, self.px, self.py, self.px+ux*w['reach'], self.py+uy*w['reach'], 9+w['width']/2):
            # v4.6a36: 双短槍・紅牙の溜めは0.08秒間隔の3連突き。
            if full and self.weapon_index == 2:
                if self.mode == 'training' and self.state == 'recover' and self.tutorial_step == 2:
                    self.tutorial_step = 3
                    self.tutorial_done = True
                    self.stop_bgm()
                    self.mode = 'training_complete'
                    self.notice = '✓ 三連突き成功'
                    return
                punish = self.state in ('recover', 'break')
                if punish:
                    self.text(self.bx-10, self.by-22, 'PUNISH', 10)
                per_hit = 10 if punish else 8
                self.benikiba_burst = [
                    [0.0, per_hit, 3, 0],
                    [.08, per_hit, 3, 1],
                    [.16, per_hit, 3, 2],
                ]
                self.update_benikiba_burst(0.0)
                return
            # v4.6a31: explicit per-weapon hit values.`,
        '連突発動'
      );

      patchRequired(
`    def hurt(self, damage):`,
`    def update_benikiba_burst(self, dt):
        if not self.benikiba_burst:
            return
        pending = self.benikiba_burst
        self.benikiba_burst = []
        for hit in pending:
            hit[0] -= dt
            if hit[0] <= 1e-8:
                self.apply_benikiba_burst_hit(hit[1], hit[2], hit[3])
                if self.bhp <= 0:
                    self.benikiba_burst = []
                    return
            else:
                self.benikiba_burst.append(hit)

    def apply_benikiba_burst_hit(self, damage, poise_damage, burst_index):
        if self.bhp <= 0 or self.mode not in ('battle', 'training'):
            return
        was_break = self.state == 'break'
        if not was_break:
            self.poise += poise_damage
            if self.poise >= 100:
                self.poise = 0
                self.state, self.timer = 'break', 3.0
                self.notice = 'BREAK! 溜め突きで追撃'
                self.text(self.bx-10, self.by-16, 'BREAK!', 10)

        self.bhp = max(0, self.bhp-damage)
        if window is not None and not self.muted:
            try:
                window.playLancerHitSfx('charge' if burst_index == 2 else 'normal')
            except Exception:
                pass

        self.hitstop_frames = max(self.hitstop_frames, 3 if burst_index == 2 else 1)
        ux, uy = math.cos(self.aa), math.sin(self.aa)
        vx, vy = -uy, ux
        offset = (-3, 3, 0)[burst_index]
        contact_x = self.bx - ux*8 + vx*offset
        contact_y = self.by - uy*8 + vy*offset
        self.hit_vfx.append([contact_x, contact_y, self.aa, 2 if burst_index == 2 else 1, .36])
        self.flash = .08
        self.text(self.bx+vx*offset, self.by-11, damage)
        self.phase = 3 if self.bhp <= 180 else 2 if self.bhp <= 360 else 1

        if self.bhp == 0 and self.mode == 'battle':
            self.stop_bgm()
            self.victory_pending = True
            self.victory_timer = 2.65
            self.hitstop_frames = 21
            self.lock = max(self.lock, 3.2)
            self.invuln = max(self.invuln, 3.2)
            self.charging, self.pending = False, None
            self.state = 'recover'
            self.flash = .12
            self.notice = 'RANK 10 撃破'
            kx, ky = unit(self.bx-self.px, self.by-self.py)
            start_x, start_y = self.bx, self.by
            target_x, target_y = start_x+kx*22, start_y+ky*22
            target_dist = math.hypot(target_x-CX, target_y-CY)
            if target_dist > R-10:
                tx, ty = unit(target_x-CX, target_y-CY)
                target_x, target_y = CX+tx*(R-10), CY+ty*(R-10)
            self.victory_start = (start_x, start_y)
            self.victory_target = (target_x, target_y)

    def hurt(self, damage):`,
        '連突処理'
      );

      if(!source.includes('BROWSER_UI = r')||!source.includes('class App:')||!source.includes('練習モード')||!source.includes('本番をはじめる')||!source.includes('BGM_CH1')||!source.includes('LAYOUT_STABILITY_FIX')||!source.includes('PRACTICE_FLOW_FIX')||!source.includes('BALANCE_UI_FIX')||!source.includes('RANK_TIMER_FIX')){
        throw new Error('ゲームデータが不完全です。ページを再読み込みしてください。');
      }
      status.textContent='Pyxelを起動しています…';
      Promise.resolve(launchPyxel({command:'run',script:source})).catch(error=>fail(String(error?.message||error)));
      watch=setInterval(()=>{
        const host=document.getElementById('lancer-shell');
        if(host){
          document.getElementById('boot-panel').hidden=true;
          clearInterval(watch);clearTimeout(timeout);
          return;
        }
        if(window.pyxelContext?.hasFatalError){
          fail('Pyxel実行環境でエラーが発生しました。再読み込みしてください。');
          return;
        }
        if(window.pyxelContext?.resolveInput){
          button.disabled=false;
          button.textContent='ゲームを起動';
          status.textContent='準備ができました。「ゲームを起動」を押してください。';
        }
      },200);
      timeout=setTimeout(()=>{
        if(!document.getElementById('lancer-shell'))fail('読み込みに時間がかかっています。接続を確認して再読み込みしてください。');
      },90000);
    }catch(error){
      fail(String(error?.message||error));
    }
  };
  window.lancerRuntimeDownloadFailed=()=>fail('Pyxelの読み込みに失敗しました。インターネット接続を確認してください。');
})();
</script>
<script src="https://cdn.jsdelivr.net/gh/kitao/pyxel@v2.9.9/wasm/pyxel.js" onload="startLancerRuntime()" onerror="lancerRuntimeDownloadFailed()"></script>
</body>
</html>
